name: Build desktop apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Check lint
        run: npm run lint

      - name: Build desktop installer
        run: npm run electron:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: billo-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.blockmap
            release/*.yml
          if-no-files-found: error
          retention-days: 3
